name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore Paperless.slnx

      - name: Check .NET formatting and analyzers
        run: dotnet format Paperless.slnx --verify-no-changes --no-restore

      - name: Run backend tests
        run: dotnet test Paperless.slnx --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Paperless.UI/package-lock.json

      - name: Install UI dependencies
        working-directory: src/Paperless.UI
        run: npm ci

      - name: Auto-format and check UI source
        working-directory: src/Paperless.UI
        run: |
          npm run format:fix
          npm run format:check

      - name: Type-check UI
        working-directory: src/Paperless.UI
        run: npm run typecheck

      - name: Run UI tests
        working-directory: src/Paperless.UI
        run: npm test -- --watch=false

      - name: Build UI
        working-directory: src/Paperless.UI
        run: npm run build

  publish:
    name: Publish container images
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: rest
            context: .
            dockerfile: ./src/Paperless.REST/dockerfile
          - service: worker
            context: .
            dockerfile: ./src/Paperless.Worker/dockerfile
          - service: indexer
            context: .
            dockerfile: ./src/Paperless.Indexer/dockerfile
          - service: minio
            context: ./docker/minio
            dockerfile: ./docker/minio/Dockerfile
          - service: ui
            context: ./src/Paperless.UI
            dockerfile: ./src/Paperless.UI/dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/paperless-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
