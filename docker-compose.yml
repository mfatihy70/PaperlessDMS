services:
  db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: always
    environment:
      POSTGRES_USER: paperless_user
      POSTGRES_PASSWORD: paperless_password
      POSTGRES_DB: paperless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless_user -d paperless_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:  
    image: dpage/pgadmin4:latest
    container_name: paperless-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paperless.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5051:80"
    depends_on:
      - db

  minio:
    build:
      context: ./docker/minio
    image: paperless-minio:local
    container_name: paperless-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperless_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-paperless_minio_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: paperless-rabbitmq
    hostname: paperless-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless_queue}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless_queue_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  paperless-worker:
    build:
      context: .
      dockerfile: src/Paperless.Worker/dockerfile
    container_name: paperless-worker
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 64
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=paperless_db;Username=paperless_user;Password=paperless_password;GSS Encryption Mode=Disable
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-paperless_minio}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-paperless_minio_password}
      - Processing__HostName=rabbitmq
      - Processing__UserName=${RABBITMQ_USER:-paperless_queue}
      - Processing__Password=${RABBITMQ_PASSWORD:-paperless_queue_password}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: paperless-elasticsearch
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - node.store.allow_mmap=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  paperless-indexer:
    build:
      context: .
      dockerfile: src/Paperless.Indexer/dockerfile
    container_name: paperless-indexer
    restart: unless-stopped
    init: true
    mem_limit: 512m
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=paperless_db;Username=paperless_user;Password=paperless_password;GSS Encryption Mode=Disable
      - Processing__HostName=rabbitmq
      - Processing__UserName=${RABBITMQ_USER:-paperless_queue}
      - Processing__Password=${RABBITMQ_PASSWORD:-paperless_queue_password}
      - Search__Endpoint=http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  paperless-summarizer:
    build:
      context: .
      dockerfile: src/Paperless.Summarizer/dockerfile
    container_name: paperless-summarizer
    restart: unless-stopped
    init: true
    mem_limit: 512m
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=paperless_db;Username=paperless_user;Password=paperless_password;GSS Encryption Mode=Disable
      - Processing__HostName=rabbitmq
      - Processing__UserName=${RABBITMQ_USER:-paperless_queue}
      - Processing__Password=${RABBITMQ_PASSWORD:-paperless_queue_password}
      - GenAi__Enabled=${GENAI_ENABLED:-false}
      - GenAi__ApiKey=${GEMINI_API_KEY:-}
      - GenAi__Model=${GEMINI_MODEL:-gemini-3.8-flash}
      - GenAi__Language=${GENAI_LANGUAGE:-de}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paperless-rest:
    build:
      context: .
      dockerfile: src/Paperless.REST/dockerfile
    container_name: paperless-rest
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=paperless_db;Username=paperless_user;Password=paperless_password;GSS Encryption Mode=Disable
      - ASPNETCORE_ENVIRONMENT=Development
      - Search__Endpoint=http://elasticsearch:9200
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-paperless_minio}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-paperless_minio_password}
      - Processing__HostName=rabbitmq
      - Processing__UserName=${RABBITMQ_USER:-paperless_queue}
      - Processing__Password=${RABBITMQ_PASSWORD:-paperless_queue_password}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  paperless-ui:
    build:
      context: ./src/Paperless.UI
      dockerfile: dockerfile
    container_name: paperless-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  elasticsearch_data:
