services:
  db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: always
    environment:
      POSTGRES_USER: paperless_user
      POSTGRES_PASSWORD: paperless_password
      POSTGRES_DB: paperless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless_user -d paperless_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  paperless-rest:
    build:
      context: ./src/Paperless.REST
      dockerfile: Dockerfile
    container_name: paperless-rest
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=paperless_db;Username=paperless_user;Password=paperless_password
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  paperless-ui:
    build:
      context: ./src/Paperless.UI
      dockerfile: Dockerfile
    container_name: paperless-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  postgres_data:
