<div class="mb-4 bg-light p-3 rounded">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Document Title *</label>
      <input type="text" formControlName="title" class="form-control" />
      @if (form.get('title')?.touched && form.get('title')?.invalid) {
        <div class="text-danger small mt-1">Title must be between 3 and 100 characters.</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold">Category</label>
      <select formControlName="categoryId" class="form-select">
        <option [ngValue]="null">-- None --</option>
        @for (cat of categories(); track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="form.invalid || isSaving()">
        @if (isSaving()) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
        }
        Save Changes
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancel.emit()">
        Cancel
      </button>
    </div>
  </form>
</div>
