<div class="card shadow-sm border-0 h-100">
  <div class="card-body">
    <h5 class="card-title fw-bold text-dark mb-3">Upload Document</h5>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Document file *</label>
        @if (!selectedFile()) {
          <input type="file" accept="*/*" class="form-control" (change)="onFileSelected($event)" />
        } @else {
          <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-success">
              {{ selectedFile()!.name }} ({{ selectedFile()!.size / 1024 | number: '1.1-1' }} KB)
            </span>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeFile()">
              Remove
            </button>
          </div>
        }
        @if (fileError()) {
          <div class="text-danger small mt-1">{{ fileError() }}</div>
        }
        <div class="form-text small">
          All file types are supported up to 25 MiB. The original file and its metadata are stored.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Category</label>
        <select formControlName="categoryId" class="form-select">
          <option [ngValue]="null">-- Unassigned --</option>
          @for (cat of categories(); track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
        @if (isSaving()) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
        }
        Upload Document
      </button>
    </form>
  </div>
</div>
