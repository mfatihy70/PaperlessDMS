<div class="card shadow-sm border-0 h-100">
  <div class="card-body">
    <h5 class="card-title fw-bold text-dark mb-3">Upload Document</h5>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Title *</label>
        <input
          type="text"
          formControlName="title"
          class="form-control"
          placeholder="e.g. Electricity Bill 2026"
        />
        @if (form.get('title')?.touched && form.get('title')?.invalid) {
          <div class="text-danger small mt-1">Title is required (min 3 chars).</div>
        }
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">File Name * (.pdf, .docx, .png)</label>
          <input
            type="text"
            formControlName="fileName"
            class="form-control"
            placeholder="bill.pdf"
          />
          @if (form.get('fileName')?.touched && form.get('fileName')?.invalid) {
            <div class="text-danger small mt-1">Valid extension required (.pdf, .docx, etc.).</div>
          }
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">File Size (Bytes) *</label>
          <input type="number" formControlName="fileSizeBytes" class="form-control" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Category</label>
        <select formControlName="categoryId" class="form-select">
          <option [ngValue]="null">-- Unassigned --</option>
          @for (cat of categories(); track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSaving()">
        @if (isSaving()) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
        }
        Upload Document
      </button>
    </form>
  </div>
</div>
