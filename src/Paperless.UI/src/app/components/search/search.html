<div class="document-search">
  <div class="input-group">
    <span class="input-group-text bg-white border-end-0">
      <i class="bi bi-search" aria-hidden="true"></i>
    </span>
    <input
      type="search"
      class="form-control border-start-0"
      placeholder="Search files or categories..."
      aria-label="Search documents by file name or category"
      aria-autocomplete="list"
      aria-controls="document-search-results"
      [attr.aria-expanded]="!!searchTerm().trim()"
      [value]="searchTerm()"
      (input)="onSearch($event)"
    />
  </div>

  @if (searchTerm().trim()) {
    <div id="document-search-results" class="search-results list-group shadow" role="listbox">
      @if (errorMessage()) {
        <div class="list-group-item text-danger small" role="status">{{ errorMessage() }}</div>
      } @else if (filteredDocuments().length) {
        @for (document of filteredDocuments(); track document.id) {
          <a
            class="list-group-item list-group-item-action"
            [routerLink]="['/documents', document.id]"
            role="option"
            (click)="clearSearch()"
          >
            <span class="d-block fw-semibold text-truncate">{{ document.fileName }}</span>
            <span class="d-block small text-muted text-truncate">
              {{ document.categoryName || 'Unassigned' }}
            </span>
          </a>
        }
      } @else {
        <div class="list-group-item text-muted small" role="status">No matching documents.</div>
      }
    </div>
  }
</div>
