<div class="mb-3">
  <a routerLink="/" class="text-decoration-none text-secondary small fw-semibold">
    &larr; Back to Dashboard
  </a>
</div>

@if (statusMessage()) {
  <div class="alert alert-success shadow-sm">{{ statusMessage() }}</div>
}
@if (errorMessage()) {
  <div class="alert alert-danger shadow-sm">{{ errorMessage() }}</div>
}

@if (isLoading()) {
  <div class="card shadow-sm border-0 py-5 text-center">
    <div class="spinner-border text-primary mx-auto mb-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted small mb-0">Fetching document metadata from database...</p>
  </div>
} @else if (document(); as doc) {
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-4">
        <div>
          <span class="badge bg-secondary-subtle text-secondary mb-2">DOCUMENT #{{ doc.id }}</span>
          <h2 class="h4 fw-bold text-dark mb-0">{{ doc.title }}</h2>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" (click)="toggleEdit()">
            {{ isEditing() ? 'Cancel' : 'Edit' }}
          </button>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteDocument()">Delete</button>
        </div>
      </div>

      @if (isEditing()) {
        <app-document-edit
          [document]="doc"
          [categories]="categories()"
          [isSaving]="isSaving()"
          (save)="handleSave($event)"
          (cancel)="toggleEdit()"
        />
      } @else {
        <app-document-view [document]="doc" />
      }
    </div>
  </div>
}
